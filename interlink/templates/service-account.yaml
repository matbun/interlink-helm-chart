---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.nodeName}}
  namespace: {{.Release.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{.Values.nodeName}}-role"
  namespace: {{.Release.Namespace}}
rules:
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - update
      - delete
      - create
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - update
      - create
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  {{- if not .Values.virtualNode.tenantNamespace }}
  {{- include "interlink.namespacedRules" . | nindent 2 }}
  {{- else }}
  # A confined node fails the pods bound to it from other namespaces, which needs
  # to list them (filtered by node name) and set their status.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/status
    verbs:
      - update
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{.Values.nodeName}}-rolebinding"
  namespace: {{.Release.Namespace}}
subjects:
  - kind: ServiceAccount
    name: {{.Values.nodeName}}
    namespace: {{.Release.Namespace}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{.Values.nodeName}}-role"
{{- with .Values.virtualNode.tenantNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ $.Values.nodeName }}-role"
  namespace: {{ . }}
rules:
  {{- include "interlink.namespacedRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ $.Values.nodeName }}-rolebinding"
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.nodeName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ $.Values.nodeName }}-role"
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{.Values.nodeName}}-secret"
  namespace: "{{.Release.Namespace}}"
  annotations:
    kubernetes.io/service-account.name: {{.Values.nodeName}}
  labels:
    kubernetes.io/service-account.name: {{.Values.nodeName}}
type: kubernetes.io/service-account-token
